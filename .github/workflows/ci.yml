# Build the package and this project's own documentation on every push, so a
# broken sdist or a broken docx build is caught before a release tag is cut.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      # Install the built wheel, not the source tree, so a missing style.docx
      # or a missing package_data entry fails here.
      - run: python -m pip install dist/*.whl sphinx-rtd-theme
      # Not -W: the docs carry pre-existing warnings (a missing dot binary,
      # an undefined substitution) that are not this package's problem.
      - run: python -m sphinx -b docx docs/source /tmp/docxbuild
      - run: test -s /tmp/docxbuild/sphinx_docx.docx
