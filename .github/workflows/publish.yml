# Release to PyPI when a v* tag is pushed.
#
# One-time setup on PyPI (https://pypi.org/manage/account/publishing/), so no
# API token has to live in this repository:
#   PyPI project name: sphinx-docx
#   Owner: Nefti-sama   Repository: sphinx-docx
#   Workflow: publish.yml   Environment: pypi
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
